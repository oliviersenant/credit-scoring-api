[project]
name = "credit-scoring-api"
version = "0.1.0"
description = "API de scoring crédit en production : FastAPI, Docker, CI/CD, monitoring et data drift"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- Exécution du modèle ---
    # Versions figées à l'identique de l'entraînement (artefacts/manifest.json) : un modèle
    # sérialisé n'est garanti que dans la version de scikit-learn et de LightGBM qui l'a écrit.
    "scikit-learn==1.9.0",
    "lightgbm==4.7.0",
    "skops==0.14.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=17.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
